version: '3.8'

services:
  babuadv-billing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: babuadv-billing
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - billing_uploads:/app/server/uploads
      - billing_generated:/app/server/generated_bills
      - billing_database:/app/server/database

volumes:
  billing_uploads:
  billing_generated:
  billing_database:
